name: Build Moritz test image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mogottsch/open-notebook-vibevoice

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Publish immutable coordinates
        run: |
          printf 'image=%s\ntag=%s\ndigest=%s\n' \
            "$IMAGE" "sha-${GITHUB_SHA}" "${{ steps.build.outputs.digest }}" \
            | tee image-coordinates.txt
      - uses: actions/upload-artifact@v6
        with:
          name: image-coordinates
          path: image-coordinates.txt
